<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BRAHMOS BHAWAN</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 36px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="font-size: 2.8rem; margin-bottom: 8px;">🏠</div>
        <h2>Sign In to BRAHMOS BHAWAN</h2>
        <p style="font-size: 0.9rem; margin-top: 4px;">Enter your Email or Student ID to continue</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Email or Student ID</label>
          <input type="text" id="username" class="form-control" placeholder="e.g. ST101 or rahul@brahmos.ac.in" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
          <span>Sign In</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem;">
        Don't have a boarder account? <a href="/register.html" style="color: var(--accent-primary); font-weight: 700; text-decoration: none;">Register Here</a>
      </div>

      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted);">
        💡 <strong>Quick Credentials:</strong><br>
        • Student: <code>rahul@brahmos.ac.in</code> / <code>student123</code><br>
        • Admin: <code>admin@brahmos.ac.in</code> / <code>admin123</code>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
