<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boarders Directory - BRAHMOS BHAWAN Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand-icon">🛡️</div>
        <div>
          <div class="sidebar-brand-title">BRAHMOS</div>
          <div class="sidebar-brand-subtitle">Admin Control</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin/dashboard.html" class="nav-link">
          <span class="nav-icon">📊</span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="/admin/food-management.html" class="nav-link">
          <span class="nav-icon">🍛</span>
          <span class="nav-text">Food Management</span>
        </a>
        <a href="/admin/complaints.html" class="nav-link">
          <span class="nav-icon">🚨</span>
          <span class="nav-text">Complaints Desk</span>
        </a>
        <a href="/admin/students.html" class="nav-link active">
          <span class="nav-icon">👥</span>
          <span class="nav-text">Boarders Directory</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="avatar user-avatar-display" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">A</div>
          <div class="user-info">
            <div class="user-name user-name-display">Warden Admin</div>
            <div class="user-role">Hostel Administrator</div>
          </div>
          <a href="#" class="btn-logout" title="Logout" style="color: var(--text-muted); text-decoration: none;">🚪</a>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title">Registered Hostel Boarders Directory</h1>
      </header>

      <div class="content-body">
        <div class="glass-panel" style="padding: 24px;">
          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Full Name</th>
                  <th>Hostel Block</th>
                  <th>Room Number</th>
                  <th>Account Role</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="admin-students-table-body">
                <tr>
                  <td colspan="6" style="text-align: center; padding: 20px;">
                    Loading boarders list...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
