<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - BRAHMOS BHAWAN</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 520px;
      padding: 36px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="font-size: 2.8rem; margin-bottom: 8px;">🏠</div>
        <h2>Boarder Registration</h2>
        <p style="font-size: 0.9rem; margin-top: 4px;">Register as a boarder of BRAHMOS BHAWAN</p>
      </div>

      <div style="background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.3); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.8rem; color: #a5b4fc; margin-bottom: 18px;">
        ℹ️ Registration is verified against the Admin Pre-Approved Boarder Roster. Please enter your exact registered name and email.
      </div>

      <form id="register-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label class="form-label" for="studentId">Student ID</label>
            <input type="text" id="studentId" class="form-control" placeholder="e.g. ST105" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="block">Hostel Block</label>
            <select id="block" class="form-control" required>
              <option value="A_BLOCK">🏢 BRAHMOS A-Block</option>
              <option value="C_BLOCK">🏢 BRAHMOS C-Block</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label class="form-label" for="roomNumber">Room Number</label>
            <input type="text" id="roomNumber" class="form-control" placeholder="e.g. 102-B" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="e.g. Vikramaditya Das" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. vikram@brahmos.ac.in" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
          <span>Register Boarder Account</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.88rem;">
        Already registered? <a href="/login.html" style="color: var(--accent-primary); font-weight: 700; text-decoration: none;">Sign In Here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
