# Server Port (Dynamic for Railway / Cloud deployment)
server.port=${PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/brahmos_bhawan?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring SQL Initialization
spring.sql.init.mode=never

# JWT Configuration (256-bit secret key)
app.jwt.secret=9a2f8c4e6b1d3a5f7e8c0b2d4f6a8c1e3b5d7f9a2c4e6b8d0f1a3c5e7b9d2f4a
app.jwt.expiration-ms=86400000

# Servlet Multipart Upload Config
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Application Settings
app.food.deadline.lunch=10:00
app.food.deadline.dinner=17:00
