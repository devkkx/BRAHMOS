<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - BRAHMOS BHAWAN</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand-icon">🏠</div>
        <div>
          <div class="sidebar-brand-title">BRAHMOS</div>
          <div class="sidebar-brand-subtitle">Bhawan Hostel</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/student/dashboard.html" class="nav-link">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="/student/food-preference.html" class="nav-link">
          <span class="nav-icon">🍛</span>
          <span class="nav-text">Food Preference</span>
        </a>
        <a href="/student/complaints.html" class="nav-link">
          <span class="nav-icon">🚨</span>
          <span class="nav-text">My Complaints</span>
        </a>
        <a href="/student/profile.html" class="nav-link active">
          <span class="nav-icon">👤</span>
          <span class="nav-text">My Profile</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="avatar user-avatar-display">U</div>
          <div class="user-info">
            <div class="user-name user-name-display">Loading...</div>
            <div class="user-role user-room-display">Boarder</div>
          </div>
          <a href="#" class="btn-logout" title="Logout" style="color: var(--text-muted); text-decoration: none;">🚪</a>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title">My Profile</h1>
      </header>

      <div class="content-body">
        <div class="glass-panel" style="padding: 32px; max-width: 600px;">
          <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 28px;">
            <div class="avatar user-avatar-display" style="width: 72px; height: 72px; font-size: 2rem;">U</div>
            <div>
              <h2 class="user-name-display">Loading...</h2>
              <div style="color: var(--accent-primary); font-weight: 700;">Hostel Boarder</div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 16px;">
            <div class="form-group">
              <label class="form-label">Student ID</label>
              <div class="form-control user-id-display" style="background: rgba(15,23,42,0.8); cursor: not-allowed;">—</div>
            </div>
            <div class="form-group">
              <label class="form-label">Hostel Block</label>
              <div class="form-control user-block-display" style="background: rgba(15,23,42,0.8); cursor: not-allowed;">—</div>
            </div>
            <div class="form-group">
              <label class="form-label">Allocated Room Number</label>
              <div class="form-control user-room-display" style="background: rgba(15,23,42,0.8); cursor: not-allowed;">—</div>
            </div>
            <div class="form-group">
              <label class="form-label">Hostel Unit</label>
              <div class="form-control" style="background: rgba(15,23,42,0.8); cursor: not-allowed;">BRAHMOS BHAWAN HOSTEL</div>
            </div>
          </div>

          <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-color);">
            <button class="btn btn-danger btn-logout" style="width: 100%;">
              <span>🚪 Sign Out of Account</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
